name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refuses to publish a version whose CHANGELOG/README are not up to date (or a wrong tag).
      - run: npm run release:check
      - run: node scripts/release-check.mjs --notes > release-notes.md
      - run: npm run build
      - run: npm test
      - run: npm run zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          name: Grabby ${{ github.ref_name }}
          body_path: release-notes.md
