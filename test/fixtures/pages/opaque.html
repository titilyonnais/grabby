<!doctype html><html><head><meta charset="utf-8"><title>Opaque player</title></head>
<body><h1>Opaque</h1>
<!-- The file has no extension and a generic type; the page also prefetches a stream segment. -->
<video id="v" src="/opaque/clip" controls muted preload="auto" width="640"></video>
<script>fetch('/media/segments/seg-2.mp4').then((r) => r.arrayBuffer()).then(() => (document.body.dataset.ready = '1'));</script>
</body></html>
