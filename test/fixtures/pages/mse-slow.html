<!doctype html><html><head><meta charset="utf-8"><title>Adaptive player test</title></head>
<body><h1>Adaptive</h1><video id="v" controls muted width="640"></video>
<script>
// A player like adaptive ones: 2-second segments fetched as playback needs them (slowly, like a
// busy network), and fetched again from the right one when the video is sent elsewhere.
const D = '/media/dash/';
const tracks = [
  { mime: 'video/mp4; codecs="avc1.4d401e"', init: 'init-stream0.m4s', seg: (n) => `chunk-stream0-0000${n}.m4s`, count: 3 },
  { mime: 'audio/mp4; codecs="mp4a.40.2"', init: 'init-stream1.m4s', seg: (n) => `chunk-stream1-0000${n}.m4s`, count: 3 },
];
const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
const ms = new MediaSource();
const video = document.getElementById('v');
video.src = URL.createObjectURL(ms);
let run = 0;
async function append(sb, url) {
  const buf = await (await fetch(url)).arrayBuffer();
  if (sb.updating) await new Promise((ok) => sb.addEventListener('updateend', ok, { once: true }));
  await new Promise((ok) => { sb.addEventListener('updateend', ok, { once: true }); sb.appendBuffer(buf); });
}
async function feed(sb, t, from, mine) {
  await append(sb, D + t.init);
  for (let n = from; n <= t.count && mine === run; n++) {
    await append(sb, D + t.seg(n));
    // The next segment only when playback is close to it.
    while (mine === run && video.currentTime < (n - 1) * 2 - 0.5) await wait(100);
    await wait(1500);
  }
}
async function start(at) {
  const mine = ++run;
  const first = Math.min(3, Math.floor(at / 2) + 1);
  await Promise.all(buffers.map((sb, i) => feed(sb, tracks[i], first, mine)));
  if (mine === run && ms.readyState === 'open' && buffers.every((sb) => !sb.updating)) {
    try { ms.endOfStream(); } catch {}
  }
}
let buffers = [];
ms.addEventListener('sourceopen', async () => {
  ms.duration = 6;
  buffers = tracks.map((t) => ms.addSourceBuffer(t.mime));
  await append(buffers[0], D + tracks[0].init);
  await append(buffers[1], D + tracks[1].init);
  document.body.dataset.ready = '1';
  video.addEventListener('seeking', () => {
    const b = buffers[0].buffered;
    const t = video.currentTime;
    for (let i = 0; i < b.length; i++) if (b.start(i) <= t + 0.1 && b.end(i) > t + 0.5) return;
    void start(t);
  });
  void start(0);
}, { once: true });
</script></body></html>
